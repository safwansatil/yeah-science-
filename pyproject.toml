[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeah-science"
version = "0.1.0"
description = "Project Altair recruitment ground station and local rover simulator"
requires-python = ">=3.10,<3.14"
dependencies = ["PySide6==6.8.3"]

[tool.setuptools]
packages = ["app", "link", "simulator"]

